<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redify Perú — Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#1A7A52; --blue-dark:#155E3E; --blue-light:#E8F5EE;
    --gray:#5B6470; --red:#E03E3E; --red-light:#FDEAEA; --red-d:#D43838;
    --bg:#F0F4F2; --bg-card:#FFFFFF; --bg-input:#FFFFFF;
    --border:#D8E5DE; --border-strong:#C0D6C8;
    --sidebar-bg:#0D2B1A; --sidebar-bg-2:#163524; --sidebar-text:#8AAE96; --sidebar-text-active:#FFFFFF;
    --text-primary:#1A2A22; --text-secondary:#4A6355; --text-muted:#7A9E8A;
    --green:#1A7A52; --green-light:#E8F5EE;
    --amber:#E08F1F; --amber-light:#FCF1E0;
    --purple:#7C5CD6; --purple-light:#EFE9FB;
    --accent:#1A7A52; --accent-dark:#155E3E; --accent-light:#E8F5EE;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text-primary); font-family:'Inter',system-ui,sans-serif; font-size:14px;}
  code,.mono{font-family:'JetBrains Mono',monospace;}
  button,select,input,textarea{font-family:inherit; font-size:13.5px;}
  a{color:var(--blue); text-decoration:none;}

  .login-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(160deg,#F7F9FC 0%,#EAF1FE 100%); padding:20px;}
  .login-card{background:var(--bg-card); border-radius:16px; box-shadow:0 12px 40px rgba(20,40,90,.10); padding:40px 40px 32px; width:100%; max-width:380px; text-align:center;}
  .login-card img{width:130px; margin-bottom:6px;}
  .login-stripe{height:6px; border-radius:4px; margin:6px auto 26px; width:140px; background:repeating-linear-gradient(90deg, var(--red) 0 8px, transparent 8px 12px);}
  .login-card .field{text-align:left; margin-bottom:16px;}
  .login-card label{display:block; font-size:12.5px; color:var(--text-secondary); margin-bottom:6px; font-weight:500;}
  .login-card select, .login-card input{width:100%; padding:11px 13px; border-radius:9px; border:1px solid var(--border-strong); background:#fff; font-size:14px;}
  .login-card select:focus, .login-card input:focus{outline:none; border-color:var(--blue);}
  .btn-login{width:100%; background:var(--blue); color:#fff; border:none; padding:12px; border-radius:9px; font-weight:600; font-size:14px; cursor:pointer; margin-top:6px;}
  .btn-login:hover{background:var(--blue-dark);}
  .login-hint{font-size:12px; color:var(--text-muted); margin-top:18px;}
  .login-hint b{color:var(--text-secondary);}

  .shell{display:flex; min-height:100vh;}
  .sidebar{width:256px; flex-shrink:0; background:var(--sidebar-bg); padding:20px 14px; position:sticky; top:0; height:100vh; overflow-y:auto; display:flex; flex-direction:column;}
  .brand{display:flex; align-items:center; gap:12px; padding:16px 8px 20px; border-bottom:1px solid rgba(255,255,255,.08); margin-bottom:14px;}
  .brand img{width:52px; height:52px; object-fit:contain; border-radius:10px;}
  .brand .bt{color:#fff; font-weight:700; font-size:16px; line-height:1.15;}
  .brand .bt span{display:block; color:var(--sidebar-text); font-weight:500; font-size:10px; letter-spacing:.06em; text-transform:uppercase;}

  .menu{flex:1;}
  .menu-parent{display:flex; align-items:center; gap:10px; width:100%; padding:10px 10px; border:none; background:none; color:var(--sidebar-text); border-radius:8px; cursor:pointer; font-size:13px; font-weight:500; text-align:left;}
  .menu-parent:hover{background:rgba(255,255,255,.05); color:#fff;}
  .menu-parent.has-active{color:#fff;}
  .menu-parent .ic{width:17px; text-align:center; opacity:.85; font-size:12.5px;}
  .menu-parent .chev{margin-left:auto; font-size:10px; transition:transform .15s; opacity:.6;}
  .menu-parent.open .chev{transform:rotate(90deg);}
  .submenu{display:none; padding-left:18px; margin:2px 0 8px;}
  .submenu.open{display:block;}
  .sublink{display:block; padding:7px 10px 7px 18px; border-left:2px solid rgba(255,255,255,.08); color:var(--sidebar-text); font-size:12.3px; border-radius:0 6px 6px 0; cursor:pointer; margin-bottom:1px;}
  .sublink:hover{color:#fff; background:rgba(255,255,255,.04);}
  .sublink.active{color:#fff; border-left-color:var(--accent); background:rgba(26,122,82,.22); font-weight:500;}
  .menu-single{padding:10px 10px; border-radius:8px; color:var(--sidebar-text); font-size:13px; font-weight:500; cursor:pointer; display:flex; align-items:center; gap:10px;}
  .menu-single:hover{background:rgba(255,255,255,.05); color:#fff;}
  .menu-single.active{background:var(--accent); color:#fff;}
  .menu-single .ic{width:17px; text-align:center; opacity:.85; font-size:12.5px;}

  .sidebar-footer{border-top:1px solid rgba(255,255,255,.08); padding-top:12px; margin-top:10px;}
  .userbox{display:flex; align-items:center; gap:9px; padding:6px 8px; border-radius:8px;}
  .avatar{width:30px; height:30px; border-radius:50%; background:var(--blue); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; flex-shrink:0;}
  .userbox .who{font-size:12.5px; color:#fff; font-weight:500; line-height:1.3;}
  .userbox .who span{display:block; color:var(--sidebar-text); font-size:11px; font-weight:400;}
  .btn-logout{width:100%; margin-top:8px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); color:var(--sidebar-text); padding:8px; border-radius:7px; font-size:12px; cursor:pointer;}
  .btn-logout:hover{color:#fff; border-color:rgba(255,255,255,.25);}

  main{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{display:none;}
  .breadcrumb{font-size:13px; color:var(--text-muted);}
  .breadcrumb b{color:var(--text-primary); font-weight:600;}
  .spacer{flex:1;}
  .grp{display:flex; align-items:center; gap:8px;}
  .grp label{color:var(--text-muted); font-size:11.5px; text-transform:uppercase; letter-spacing:.04em;}
  .date-pill{background:var(--blue-light); border:1px solid #CFE0FB; padding:6px 12px; border-radius:6px; font-family:'JetBrains Mono',monospace; color:var(--blue-dark); font-size:12.5px;}

  select, input, textarea{ background:var(--bg-input); border:1px solid var(--border-strong); color:var(--text-primary); padding:8px 11px; border-radius:7px; outline:none; }
  select:focus, input:focus, textarea:focus{border-color:var(--blue);}
  .btn{ background:var(--blue); color:#fff; border:none; padding:9px 15px; border-radius:7px; font-weight:600; cursor:pointer; font-size:13px; transition:background .15s; }
  .btn:hover{background:var(--blue-dark);}
  .btn.secondary{background:#fff; color:var(--text-secondary); border:1px solid var(--border-strong);}
  .btn.secondary:hover{color:var(--text-primary); border-color:var(--gray);}
  .btn.danger{background:var(--red);}
  .btn.danger:hover{background:var(--red-d);}
  .btn.ghost{background:none; border:none; color:var(--blue); padding:5px 8px; font-size:12.5px; font-weight:500;}
  .btn.ghost.muted{color:var(--text-secondary);}
  .btn.ghost.red{color:var(--red);}
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  .btn-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:10px; flex-wrap:wrap;}

  .page{padding:28px 32px 60px; max-width:1320px;}
  .page-head{margin-bottom:20px;}
  .page-head h1{font-size:20px; margin:0 0 4px; font-weight:700;}
  .page-head .desc{color:var(--text-secondary); font-size:13.5px; margin:0;}

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
  .grid4{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px;}
  .stat{border-radius:12px; padding:18px 20px; color:#fff; position:relative; overflow:hidden;}
  .stat.c1{background:linear-gradient(135deg,#1AA971,#0E8259);}
  .stat.c2{background:linear-gradient(135deg,#1463E8,#0E4DBB);}
  .stat.c3{background:linear-gradient(135deg,#7C5CD6,#5C3DB8);}
  .stat.c4{background:linear-gradient(135deg,#E03E3E,#B92E2E);}
  .stat .lbl{font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; opacity:.85; margin-bottom:8px;}
  .stat .num{font-size:28px; font-weight:700;}
  .stat .sub{font-size:12px; opacity:.85; margin-top:4px;}

  .card{background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:22px; margin-bottom:20px; box-shadow:0 1px 2px rgba(20,40,90,.03);}
  .card h3{font-size:14.5px; margin:0 0 16px; font-weight:600; display:flex; align-items:center; gap:8px;}
  .card h3 .tag{font-size:10.5px; color:var(--blue); background:var(--blue-light); padding:2px 8px; border-radius:10px; font-weight:600; text-transform:none;}

  .filter-panel{background:var(--blue-light); border:1px solid #CFE0FB; border-radius:12px; padding:18px 20px; margin-bottom:20px;}
  .filter-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:12px;}
  .filter-grid .field label{color:var(--blue-dark);}

  .form-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--text-secondary); margin-bottom:5px; font-weight:500;}
  .field select, .field input, .field textarea{width:100%;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  thead th{text-align:left; color:var(--text-muted); font-weight:600; padding:10px 12px; border-bottom:1px solid var(--border-strong); font-size:11px; text-transform:uppercase; letter-spacing:.04em; white-space:nowrap; background:#FAFBFD;}
  tbody td{padding:11px 12px; border-bottom:1px solid var(--border); vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FAFBFD;}
  .table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:10px;}
  .table-wrap table{border:none;}
  .rowlink{cursor:pointer;}

  .badge{display:inline-block; padding:3px 9px; border-radius:6px; font-size:11px; font-weight:600;}
  .badge.green{background:var(--green-light); color:var(--green);}
  .badge.amber{background:var(--amber-light); color:var(--amber);}
  .badge.red{background:var(--red-light); color:var(--red);}
  .badge.gray{background:#F0F2F6; color:var(--text-secondary);}
  .badge.purple{background:var(--purple-light); color:var(--purple);}
  .badge.blue{background:var(--blue-light); color:var(--blue-dark);}

  .mono-cell{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--text-secondary);}
  .empty{color:var(--text-muted); font-size:13px; padding:26px 0; text-align:center;}

  .pager{display:flex; align-items:center; justify-content:center; gap:14px; padding:14px 0 2px;}
  .pager-info{font-size:12px; color:var(--text-muted);}

  .modal-bg{position:fixed; inset:0; background:rgba(15,20,35,.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;}
  .modal{background:#fff; border-radius:14px; padding:26px; max-width:480px; width:100%; max-height:88vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.25);}
  .modal h3{margin:0 0 10px; font-size:16px; font-weight:700;}
  .modal p{color:var(--text-secondary); font-size:13.5px; margin:0 0 18px;}
  .modal .actions{display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; margin-top:6px;}

  .toast{position:fixed; bottom:22px; right:22px; background:#fff; border-left:4px solid var(--blue); color:var(--text-primary); padding:13px 18px; border-radius:10px; font-size:13px; z-index:200; box-shadow:0 10px 30px rgba(0,0,0,.15); max-width:320px;}

  .perm-note{font-size:12.5px; color:var(--text-secondary); background:var(--amber-light); border:1px solid #F4DDB0; border-radius:8px; padding:10px 14px; margin-bottom:18px;}
  .info-note{font-size:12.5px; color:var(--blue-dark); background:var(--blue-light); border:1px solid #CFE0FB; border-radius:8px; padding:10px 14px; margin-bottom:18px;}
  .subnote{font-size:12px; color:var(--text-muted); margin:-6px 0 14px;}

  .chip-list{display:flex; flex-wrap:wrap; gap:6px;}
  .chip{background:#F0F2F6; border:1px solid var(--border-strong); padding:3px 9px; border-radius:6px; font-size:11.5px; color:var(--text-secondary); font-family:'JetBrains Mono',monospace;}

  .breadcrumbs-page{font-size:12px; color:var(--text-muted); margin-bottom:6px;}
  .breadcrumbs-page a{color:var(--blue); cursor:pointer;}

  /* search picker (autocompletado) */
  .sp{position:relative;}
  .sp-input{width:100%;}
  .sp-list{position:absolute; top:calc(100% + 4px); left:0; right:0; background:#fff; border:1px solid var(--border-strong); border-radius:8px; box-shadow:0 8px 24px rgba(20,40,90,.12); max-height:240px; overflow-y:auto; z-index:50; display:none;}
  .sp-item{padding:9px 12px; font-size:13px; cursor:pointer; border-bottom:1px solid var(--border);}
  .sp-item:last-child{border-bottom:none;}
  .sp-item:hover, .sp-item.hl{background:var(--blue-light);}
  .sp-item .s{display:block; font-size:11px; color:var(--text-muted); margin-top:1px;}
  .sp-empty{padding:12px; font-size:12.5px; color:var(--text-muted);}

  /* lista de checks con filtro (multi-select escalable) */
  .checklist-box{border:1px solid var(--border-strong); border-radius:8px; max-height:200px; overflow-y:auto; margin-top:6px;}
  .checklist-item{display:flex; align-items:center; gap:8px; padding:8px 12px; border-bottom:1px solid var(--border); font-size:13px;}
  .checklist-item:last-child{border-bottom:none;}
  .checklist-item input{width:auto;}

  /* tabs ficha de cliente */
  .tabs{display:flex; gap:4px; border-bottom:2px solid var(--border); margin-bottom:20px; overflow-x:auto;}
  .tab-btn{padding:11px 16px; background:none; border:none; cursor:pointer; font-size:13.3px; font-weight:500; color:var(--text-secondary); border-bottom:2px solid transparent; margin-bottom:-2px; white-space:nowrap;}
  .tab-btn:hover{color:var(--text-primary);}
  .tab-btn.active{color:var(--blue); border-bottom-color:var(--blue); font-weight:600;}

  .receipt{background:#fff; border:1px solid var(--border); border-radius:12px; padding:30px; max-width:680px;}
  .receipt-head{display:flex; align-items:center; justify-content:space-between; border-bottom:2px solid var(--text-primary); padding-bottom:16px; margin-bottom:20px;}
  .receipt-head img{width:60px;}
  .receipt-head .num{text-align:right;}
  .receipt-head .num .n{font-size:20px; font-weight:700; font-family:'JetBrains Mono',monospace;}
  .receipt-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:20px; font-size:13px;}
  .receipt-grid .lbl{color:var(--text-muted); font-size:11px; text-transform:uppercase; letter-spacing:.04em; margin-bottom:3px;}
  .receipt hr{border:none; border-top:1px solid var(--border); margin:18px 0;}
  .receipt-comment{background:#FAFBFD; border:1px solid var(--border); border-radius:8px; padding:14px 16px; font-size:13.5px; white-space:pre-wrap;}

  @media print{
    .shell > .sidebar, .topbar, .no-print{ display:none !important; }
    .page{ padding:0; max-width:none; }
    body{ background:#fff; }
    .receipt{ border:none; padding:0; }
  }
  @media (max-width:880px){
    .shell{flex-direction:column;}
    .sidebar{width:100%; height:auto; position:relative;}
    .grid2{grid-template-columns:1fr;}
    .grid4{grid-template-columns:1fr 1fr;}
    .page{padding:18px;}
  }
</style>
</head>

function addDaysISO(iso, n){ const d = new Date(iso); d.setDate(d.getDate()+n); return hoyISO(d); }
function fmtFecha(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }
function nextId(arr){ return arr.reduce((m,x)=>Math.max(m,x.id),0) + 1; }
function iniciales(nombre){ return (nombre||'').split(' ').filter(Boolean).slice(0,2).map(s=>s[0].toUpperCase()).join(''); }
function norm(s){ return (s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }

  idSeq.orden = db.ordenes.reduce((m,o)=>Math.max(m,o.id),0);

function cloudRow(table, row){
  const cfg = CLOUD_TABLES[table];
  const out = {};
  cfg.columns.forEach(k => {
    if (row[k] !== undefined) out[k] = row[k];
  });
  return out;
}
function normalizeCloudDb(){
  ['sedes','sectores','planes','tipos_material','materiales','items_serializados','ingresos_almacen','asignaciones','clientes','ordenes','recibos','pagos'].forEach(k => { if (!Array.isArray(db[k])) db[k] = []; });
  (db.tipos_material||[]).forEach(t => {
    t.id = Number(t.id);
    if (typeof t.campos_extra === 'string') { try { t.campos_extra = JSON.parse(t.campos_extra); } catch(e){ t.campos_extra = []; } }
    if (!Array.isArray(t.campos_extra)) t.campos_extra = [];
  });
  (db.clientes||[]).forEach(c => {
    ['codigo','plan_id','sede_id','sector_id','caja_nap_id','puerto_nap'].forEach(k => { if (c[k] !== null && c[k] !== undefined && c[k] !== '') c[k] = Number(c[k]); });
    ['saldo_a_favor'].forEach(k => { if (c[k] !== null && c[k] !== undefined && c[k] !== '') c[k] = Number(c[k]); });
  });
  (db.planes||[]).forEach(p => { p.id = Number(p.id); p.precio = Number(p.precio||0); });
  (db.sedes||[]).forEach(s => { s.id = Number(s.id); });
  (db.sectores||[]).forEach(s => { s.id = Number(s.id); if (s.sede_id) s.sede_id = Number(s.sede_id); });
  (db.materiales||[]).forEach(m => { m.id = Number(m.id); m.tipo_material_id = Number(m.tipo_material_id); m.precio_unitario = Number(m.precio_unitario||0); if (typeof m.atributos === 'string') { try { m.atributos = JSON.parse(m.atributos); } catch(e){ m.atributos = {}; } } if (!m.atributos) m.atributos = {}; });
  (db.items_serializados||[]).forEach(i => { i.id = Number(i.id); i.material_id = Number(i.material_id); if (i.sede_id) i.sede_id = Number(i.sede_id); if (i.orden_id) i.orden_id = Number(i.orden_id); if (i.ingreso_id) i.ingreso_id = Number(i.ingreso_id); if (i.asignacion_id) i.asignacion_id = Number(i.asignacion_id); });
  (db.ingresos_almacen||[]).forEach(i => { i.id = Number(i.id); i.material_id = Number(i.material_id); i.cantidad = Number(i.cantidad||0); });
  (db.asignaciones||[]).forEach(a => { a.id = Number(a.id); a.material_id = Number(a.material_id); a.sede_id = Number(a.sede_id); a.cantidad = Number(a.cantidad||0); });
  (db.ordenes||[]).forEach(o => {
    ['id','cliente_codigo','motivo_id','sector_id','recibo_id'].forEach(k => { if (o[k] !== null && o[k] !== undefined && o[k] !== '') o[k] = Number(o[k]); });
    if (!o.vendedor_id) o.vendedor_id = db.clientes.find(c => c.codigo === o.cliente_codigo)?.vendedor_id || null;
    if (!o.consumos) o.consumos = [];
  });
  (db.recibos||[]).forEach(r => {
    ['id','cliente_codigo'].forEach(k => { if (r[k] !== null && r[k] !== undefined && r[k] !== '') r[k] = Number(r[k]); });
    ['monto','monto_pagado'].forEach(k => { if (r[k] !== null && r[k] !== undefined && r[k] !== '') r[k] = Number(r[k]); });
  });
  (db.pagos||[]).forEach(p => {
    ['id','recibo_id'].forEach(k => { if (p[k] !== null && p[k] !== undefined && p[k] !== '') p[k] = Number(p[k]); });
    if (p.monto !== null && p.monto !== undefined && p.monto !== '') p.monto = Number(p.monto);
  });
  if (!Array.isArray(db.orden_consumos)) db.orden_consumos = [];
  (db.orden_consumos||[]).forEach(c => {
    ['id','orden_id','material_id','cantidad'].forEach(k => { if (c[k] !== null && c[k] !== undefined) c[k] = Number(c[k]); });
    if (c.item_serializado_id) c.item_serializado_id = Number(c.item_serializado_id);
    else c.item_serializado_id = null;
    c.precio_unitario = Number(c.precio_unitario||0);
    c.monto_total = Number(c.monto_total||0);
  });
  // Reconstruir consumos dentro de cada orden ANTES de calcular stock
  (db.ordenes||[]).forEach(o => {
    o.consumos = (db.orden_consumos||[]).filter(c => c.orden_id === o.id);
  });
  // Reconstruir inventario_central e inventario_sede desde ingresos y asignaciones
  db.inventario_central = {};
  db.inventario_sede = {};
  (db.ingresos_almacen||[]).forEach(i => {
    db.inventario_central[i.material_id] = (db.inventario_central[i.material_id]||0) + i.cantidad;
  });
  (db.asignaciones||[]).forEach(a => {
    db.inventario_central[a.material_id] = (db.inventario_central[a.material_id]||0) - a.cantidad;
    const key = `${a.material_id}_${a.sede_id}`;
    db.inventario_sede[key] = (db.inventario_sede[key]||0) + a.cantidad;
  });
  // Descontar consumos no serializados de órdenes (ahora sí tienen consumos)
  (db.orden_consumos||[]).forEach(c => {
    if (!c.item_serializado_id && c.material_id && c.orden_id) {
      const orden = db.ordenes.find(o => o.id === c.orden_id);
      if (!orden) return;
      const cliente = db.clientes.find(cl => cl.codigo === orden.cliente_codigo);
      if (!cliente) return;
      const key = `${c.material_id}_${cliente.sede_id}`;
      db.inventario_sede[key] = Math.max(0, (db.inventario_sede[key]||0) - c.cantidad);
    }
  });
  // Descontar items serializados instalados
  (db.items_serializados||[]).forEach(i => {
    if (i.estado === 'instalado' && i.sede_id) {
      const key = `${i.material_id}_${i.sede_id}`;
      db.inventario_sede[key] = Math.max(0, (db.inventario_sede[key]||0) - 1);
    }
  });
  recalcIdSeq();
}
async function loadCloudDb(){
  if (!supabaseClient) return;
  syncingFromCloud = true;
  try {
    const entries = await Promise.all(Object.keys(CLOUD_TABLES).map(async table => {
      const cfg = CLOUD_TABLES[table];
      const { data, error } = await supabaseClient.from(table).select('*').order(cfg.pk, { ascending:true });
      if (error) throw error;
      return [table, data || []];
    }));
    entries.forEach(([table, rows]) => {
      if (rows.length || ['usuarios','clientes','ordenes','recibos','pagos','materiales','tipos_material','items_serializados','ingresos_almacen','asignaciones','orden_consumos'].includes(table)) db[table] = rows;
    });
    normalizeCloudDb();
    saveLocalOnly();
  } finally {
    syncingFromCloud = false;
  }
}

// ── Realtime: suscripción a cambios de Supabase ──────────────────────────────
let realtimeChannel = null;
let autoRefreshTimer = null;

function iniciarRealtime(){
  if (!supabaseClient || realtimeChannel) return;
  // Suscribirse a todas las tablas críticas
  const tablasCriticas = ['ordenes','orden_consumos','items_serializados','ingresos_almacen','asignaciones','clientes','recibos','pagos'];
  realtimeChannel = supabaseClient.channel('redify-sync')
    .on('postgres_changes', { event:'*', schema:'public' }, async (payload) => {
      if (!sesion) return;
      const tabla = payload.table;
      if (!tablasCriticas.includes(tabla)) return;
      // Recargar solo la tabla que cambió y las dependientes
      const tablasRecargar = [tabla];
      if (['ingresos_almacen','asignaciones','orden_consumos','items_serializados'].includes(tabla)) {
        tablasRecargar.push('ordenes');
      }
      await recargarTablas(tablasRecargar);
    })
    .subscribe();

  // Auto-refresh cada 30 segundos como respaldo
  autoRefreshTimer = setInterval(async () => {
    if (!sesion || syncingFromCloud) return;
    await loadCloudDb().catch(() => {});
    if (document.getElementById('page')) renderPage();
  }, 30000);
}

function detenerRealtime(){
  if (realtimeChannel) { supabaseClient?.removeChannel(realtimeChannel); realtimeChannel = null; }
  if (autoRefreshTimer) { clearInterval(autoRefreshTimer); autoRefreshTimer = null; }
}

async function recargarTablas(tablas){
  if (!supabaseClient || syncingFromCloud) return;
  syncingFromCloud = true;
  try {
    const entries = await Promise.all(tablas.map(async table => {
      if (!CLOUD_TABLES[table]) return null;
      const cfg = CLOUD_TABLES[table];
      const { data, error } = await supabaseClient.from(table).select('*').order(cfg.pk, { ascending:true });
      if (error) return null;
      return [table, data || []];
    }));
    entries.forEach(e => {
      if (!e) return;
      const [table, rows] = e;
      db[table] = rows;
    });
    normalizeCloudDb();
    saveLocalOnly();
    const modalAbierto = document.getElementById('modalRoot')?.children?.length > 0;
    const vistaActiva = nav?.view || '';
    const enAccion = ['ordenes.descargar','ordenes.nueva','clientes.registrar'].includes(vistaActiva) || modalAbierto;
    if (document.getElementById('page') && !enAccion) renderPage();
  } finally {
    syncingFromCloud = false;
  }
}
// Tablas que cambiaron en esta sesión y deben subirse a Supabase
const dirtyTables = new Set();
function markDirty(...tables){ tables.forEach(t => dirtyTables.add(t)); }

async function flushCloudSave(){
  if (!supabaseClient || !sesion || syncingFromCloud) return;
  const tablesToSave = [...dirtyTables];
  dirtyTables.clear();
  for (const table of tablesToSave) {
    if (!CLOUD_TABLES[table]) continue;
    const rows = (db[table] || []).map(row => cloudRow(table, row)).filter(row => row[CLOUD_TABLES[table].pk] !== undefined && row[CLOUD_TABLES[table].pk] !== null);
    if (!rows.length) continue;
    const { error } = await supabaseClient.from(table).upsert(rows, { onConflict:CLOUD_TABLES[table].pk });
    if (error) { dirtyTables.add(table); throw error; } // reintentar
  }
}
function queueCloudSave(){
  if (!supabaseClient || !sesion || syncingFromCloud) return;
  clearTimeout(cloudSaveTimer);
  cloudSaveTimer = setTimeout(() => {
    flushCloudSave().catch(err => {
      console.error('Error sincronizando Supabase:', err);
      toast('No se pudo sincronizar con Supabase. Se guardó localmente.');
    });
  }, 600);
}
function deleteCloudRow(table, id){
  if (!supabaseClient || !sesion || !CLOUD_TABLES[table]) return;
  const pk = CLOUD_TABLES[table].pk;
  supabaseClient.from(table).delete().eq(pk, id).then(({ error }) => {
    if (error) {
      console.error('Error eliminando en Supabase:', error);
      toast('Se eliminó localmente, pero no en Supabase.');
    }
  });
}
function saveLocalOnly(){} // sin localStorage
function save(...tables){ if (tables.length) markDirty(...tables); queueCloudSave(); }
function saveTablas(...tables){ markDirty(...tables); queueCloudSave(); }
function saveAll(){ Object.keys(CLOUD_TABLES).forEach(t => dirtyTables.add(t)); queueCloudSave(); }
function toast(msg){
  const t = document.createElement('div'); t.className='toast'; t.textContent = msg;
  document.getElementById('toastRoot').appendChild(t);
  setTimeout(()=>t.remove(), 3800);
}
function mostrarErrorFatal(err){
  const root = document.getElementById('root');
  root.innerHTML = `<div style="max-width:680px; margin:60px auto; padding:28px; background:#FDEAEA; border:1px solid #E03E3E; border-radius:12px; font-family:sans-serif;">
    <h2 style="color:#D43838; margin-top:0;">Ocurrió un error inesperado</h2>
    <p style="color:#5B6470;">Copia este mensaje y compártelo para poder corregirlo:</p>
    <pre style="background:#fff; padding:14px; border-radius:8px; overflow:auto; font-size:12.5px; white-space:pre-wrap;">${(err && err.stack) || err}</pre>
    <button onclick="location.reload()" style="margin-top:14px; padding:9px 16px; background:#1463E8; color:#fff; border:none; border-radius:7px; cursor:pointer;">Recargar</button>
  </div>`;
}
window.addEventListener('error', (e) => {
  if (e.message === 'Script error.' && !e.error) {
    window.showSupabaseLoadError && window.showSupabaseLoadError();
    return;
  }
  console.error('Error capturado:', e.error || e.message);
  mostrarErrorFatal(e.error || e.message);
});

/* ---------------------------------------------------------------
   INTEGRACIÓN CON EL BACKEND MIKROTIK (redify-backend en PC CyberTV)
   URL por defecto: http://100.85.220.102:3001
   Si el backend no responde, el panel sigue funcionando simulado
   y avisa con un toast — nunca bloquea el flujo principal.
--------------------------------------------------------------- */
async function backendFetch(path, options={}){
  if (!db.backendUrl) return { ok:false, simulado:true };
  try {
    const controller = new AbortController();
    const tid = setTimeout(() => controller.abort(), 25000);
    const res = await fetch(db.backendUrl + path, {
      headers: { 'Content-Type': 'application/json' },
      signal: controller.signal, ...options
    });
    clearTimeout(tid);
    return await res.json();
  } catch(err) {
    return { ok:false, error: err.name==='AbortError' ? 'timeout' : err.message };
  }
}
function toastPersistente(msg, id='toast-persistente'){
  let t = document.getElementById(id);
  if (!t) { t = document.createElement('div'); t.id = id; t.className = 'toast'; t.style.borderLeftColor = 'var(--amber)'; document.getElementById('toastRoot').appendChild(t); }
  t.textContent = msg;
  return () => t.remove(); // retorna función para cerrarlo
}

function generarNumeroOrden(tipo){
  db.contadores_orden[tipo] = (db.contadores_orden[tipo]||0) + 1;
  const PREFIJOS = { instalacion:'INST', soporte:'SOP', corte_moroso:'CORTE', reconexion:'RECON', inspeccion:'INSP',
    traslado_domicilio:'TRASLD', traslado_interno:'TRASLI', cambio_plan:'CAMBP', cambio_equipo:'CAMBEQ',
    retiro_equipo:'RETIRO', corte_voluntario:'CORTEV' };
  return `${PREFIJOS[tipo]}-${String(db.contadores_orden[tipo]).padStart(5,'0')}`;
}
function esFeriado(iso){ return db.feriados.includes(iso); }
function esDomingo(iso){ return new Date(iso+'T00:00:00').getDay() === 0; }
function calcularVencimiento(periodoYYYYMM){
  const [y,m] = periodoYYYYMM.split('-').map(Number);
  let d = new Date(y, m, 6); let iso = hoyISO(d);
  while (esDomingo(iso) || esFeriado(iso)) { iso = addDaysISO(iso, 1); }
  return iso;
}
function siguientePeriodo(periodoYYYYMM){
  const [y,m] = periodoYYYYMM.split('-').map(Number); // m es 1-12
  const d = new Date(y, m, 1); // m (sin -1) ya cae en el mes siguiente
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function puedeEditarOrden(orden){

  if (orden.estado !== 'cerrada') return true;

function crearOrden({ tipo, cliente_codigo, tecnico_id, descripcion, recibo_id, clase_servicio, motivo_id, sector_id, vendedor_id }) {

    clase_servicio: clase_servicio || null, motivo_id: motivo_id || null,

function cerrarOrden(ordenId, comentario){

  markDirty('ordenes', 'clientes', 'recibos');
}
// Efectos sobre el cliente que se aplican recién cuando la orden se DESCARGA (cierra),
// no cuando se crea — sea una orden automática (corte por mora, reconexión) o manual.
function aplicarEfectoCierreOrden(orden){
  const cliente = getCliente(orden.cliente_codigo);
  if (!cliente) return;
  if (orden.tipo === 'instalacion' && cliente.estado === 'por_instalar') {
    const anterior = cliente.estado; cliente.estado = 'activo';
    registrarLogCliente(cliente.codigo, 'Estado', anterior, 'activo (instalación completada)');
    generarPrimerRecibo(cliente);
  } else if (orden.tipo === 'corte_voluntario') {
    const anterior = cliente.estado; cliente.estado = 'suspendido'; cliente.motivo_corte = 'voluntario';
    registrarLogCliente(cliente.codigo, 'Estado', anterior, 'suspendido (corte voluntario)');
  } else if (orden.tipo === 'corte_moroso') {
    const anterior = cliente.estado; cliente.estado = 'suspendido'; cliente.motivo_corte = 'moroso';
    registrarLogCliente(cliente.codigo, 'Estado', anterior, 'suspendido (corte por mora)');
  } else if (orden.tipo === 'reconexion') {
    const anterior = cliente.estado; cliente.estado = 'activo'; cliente.motivo_corte = null;
    registrarLogCliente(cliente.codigo, 'Estado', anterior, 'activo (reconexión)');
  }
}

function avanzarDia(){
  db.fechaActual = addDaysISO(db.fechaActual, 1);
  // 1. Generar recibos faltantes para todos los clientes activos/morosos
  db.clientes.forEach(c => sincronizarRecibosCliente(c));
  // 2. Cortar los que vencieron sin pagar
  let cortes = 0;
  db.recibos.filter(r => r.estado === 'pendiente' && r.fecha_vencimiento < db.fechaActual).forEach(r => {
    const cliente = getCliente(r.cliente_codigo);
    if (cliente && cliente.estado === 'activo') { ejecutarCorteMoroso(r.id); cortes++; }
    else { r.estado = 'vencido'; }
  });
  save(); renderAll();
  toast(cortes > 0 ? `Día avanzado a ${fmtFecha(db.fechaActual)}. ${cortes} cliente(s) cortado(s) por mora.` : `Día avanzado a ${fmtFecha(db.fechaActual)}.`);
}
function pendienteDeRecibo(recibo){ return Math.max(0, recibo.monto - (recibo.monto_pagado||0)); }

// Aplica el saldo a favor del cliente (si tiene) contra un recibo recién creado.
// Genera todos los recibos que le faltan a un cliente activo desde su
// último recibo hasta el mes actual.
function sincronizarRecibosCliente(cliente){
  if (!cliente || !['activo','suspendido'].includes(cliente.estado)) return;
  if (cliente.estado === 'suspendido' && cliente.motivo_corte === 'voluntario') return;
  const mesActual = db.fechaActual.slice(0,7);
  const recibosCliente = db.recibos.filter(r => r.cliente_codigo === cliente.codigo).sort((a,b)=>a.periodo.localeCompare(b.periodo));
  if (recibosCliente.length === 0) return;
  let periodoBase = recibosCliente[recibosCliente.length-1].periodo;
  let limite = 24;
  while (limite-- > 0) {
    const siguiente = siguientePeriodo(periodoBase);
    if (siguiente > mesActual) break;
    if (!db.recibos.some(r => r.cliente_codigo === cliente.codigo && r.periodo === siguiente)) {
      const plan = getPlan(cliente.plan_id);
      const recibo = { id: ++idSeq.recibo, cliente_codigo: cliente.codigo, periodo: siguiente,
        monto: plan ? plan.precio : 0, monto_pagado: 0,
        fecha_vencimiento: calcularVencimiento(siguiente), estado: 'pendiente' };
      db.recibos.push(recibo);
      aplicarSaldoAFavor(recibo);
    }
    periodoBase = siguiente;
  }
}
// Aplica el saldo a favor del cliente contra un recibo recién creado.
function aplicarSaldoAFavor(recibo){
  const cliente = getCliente(recibo.cliente_codigo);
  if (!cliente || !cliente.saldo_a_favor || cliente.saldo_a_favor <= 0) return 0;
  const pendiente = pendienteDeRecibo(recibo);
  if (pendiente <= 0) return 0;
  const aplicado = Math.min(cliente.saldo_a_favor, pendiente);
  recibo.monto_pagado = (recibo.monto_pagado||0) + aplicado;
  cliente.saldo_a_favor -= aplicado;
  db.pagos.push({ id: ++idSeq.pago, recibo_id: recibo.id, monto: aplicado, fecha_pago: db.fechaActual, metodo: 'Saldo a favor (adelanto)', estado:'activo', anulado_por:null, fecha_anulacion:null, motivo:null });
  if (pendienteDeRecibo(recibo) <= 0) recibo.estado = 'pagado';
  return aplicado;
}

// Se dispara una sola vez, al cerrar la orden de instalación — es el primer recibo
// del cliente, y a partir de ahí el ciclo sigue solo (un pago genera el siguiente).
function generarPrimerRecibo(cliente){
  const periodo = db.fechaActual.slice(0,7);
  if (db.recibos.some(r => r.cliente_codigo === cliente.codigo && r.periodo === periodo)) return;
  const plan = getPlan(cliente.plan_id);
  const recibo = { id: ++idSeq.recibo, cliente_codigo: cliente.codigo, periodo, monto: plan?plan.precio:0, monto_pagado:0, fecha_vencimiento: calcularVencimiento(periodo), estado:'pendiente' };
  db.recibos.push(recibo);
  aplicarSaldoAFavor(recibo);
}

// Se llama justo después de que un recibo queda totalmente pagado: genera de inmediato
// el recibo del siguiente periodo (no hay que esperar al ciclo mensual ni a la fecha real).
// Si el cliente tiene saldo a favor (pagó de más), sigue encadenando meses hasta agotarlo,
// devolviendo el detalle de qué periodo(s) quedaron cubiertos y por cuánto.
function generarSiguienteRecibo(clienteCodigo, periodoBase){
  const cliente = getCliente(clienteCodigo);
  const detalle = [];
  let periodoActual = periodoBase;
  const mesActual = db.fechaActual.slice(0,7);
  let limite = 24;
  while (limite-- > 0) {
    const siguiente = siguientePeriodo(periodoActual);
    const tieneSaldo = (cliente.saldo_a_favor || 0) > 0;
    // Si el mes siguiente no llegó y no hay saldo, parar aquí
    if (siguiente > mesActual && !tieneSaldo) break;
    const existente = db.recibos.find(r => r.cliente_codigo === clienteCodigo && r.periodo === siguiente);
    if (existente) {
      // Mes ya existe: aplicar saldo a favor si tiene algo pendiente
      if (tieneSaldo && pendienteDeRecibo(existente) > 0) {
        const aplicado = aplicarSaldoAFavor(existente);
        if (aplicado > 0) detalle.push({ periodo: siguiente, monto: aplicado, completo: existente.estado === 'pagado' });
      }
      // Solo seguir si el recibo quedó totalmente pagado y aún hay saldo
      if (existente.estado !== 'pagado' || (cliente.saldo_a_favor || 0) <= 0) break;
      periodoActual = siguiente; continue;
    }
    // Mes no existe: solo crearlo si ya llegó o hay saldo para adelantarlo
    if (siguiente > mesActual && !tieneSaldo) break;
    const plan = getPlan(cliente.plan_id);
    const recibo = { id: ++idSeq.recibo, cliente_codigo: clienteCodigo, periodo: siguiente,
      monto: plan?plan.precio:0, monto_pagado:0, fecha_vencimiento: calcularVencimiento(siguiente), estado:'pendiente' };
    db.recibos.push(recibo);
    const aplicado = aplicarSaldoAFavor(recibo);
    if (aplicado > 0) detalle.push({ periodo: siguiente, monto: aplicado, completo: recibo.estado === 'pagado' });
    if (recibo.estado !== 'pagado') break;
    periodoActual = siguiente;
  }
  return detalle;
}

function registrarPago(reciboId, monto, metodo){
  const recibo = getRecibo(reciboId);
  const cliente = getCliente(recibo.cliente_codigo);
  const eraVencido = recibo.estado === 'vencido';
  const pago = { id: ++idSeq.pago, recibo_id: reciboId, monto, fecha_pago: db.fechaActual, metodo, estado:'activo', anulado_por:null, fecha_anulacion:null, motivo:null };
  db.pagos.push(pago);
  recibo.monto_pagado = (recibo.monto_pagado||0) + monto;

  let excedente = 0;
  let quedoCompleto = false;
  let detalleAdelanto = [];
  if (recibo.monto_pagado >= recibo.monto) {
    excedente = recibo.monto_pagado - recibo.monto;
    recibo.monto_pagado = recibo.monto;
    recibo.estado = 'pagado';
    quedoCompleto = true;
    if (excedente > 0) cliente.saldo_a_favor = (cliente.saldo_a_favor||0) + excedente;
    // Pago completo -> se genera de inmediato el recibo del siguiente periodo (y los que el saldo a favor alcance a cubrir)
    detalleAdelanto = generarSiguienteRecibo(cliente.codigo, recibo.periodo);
    pago.detalle_adelanto = detalleAdelanto; // queda guardado para mostrarlo en el comprobante
  }
  save('pagos', 'recibos', 'clientes'); renderAll();
  closeModal(); // cierra el formulario de pago antes de, si corresponde, abrir la pregunta de reconexión
  goTo('finanzas.comprobante', { pagoId: pago.id, clienteCodigo: cliente.codigo });

  if (!quedoCompleto) {
    toast(`Pago parcial registrado. Aún debe S/ ${pendienteDeRecibo(recibo).toFixed(2)} de este periodo.`);
    return;
  }
  if (detalleAdelanto.length > 0) {
    const resumen = detalleAdelanto.map(d => `${d.periodo}: S/ ${d.monto.toFixed(2)}${d.completo ? ' (cubierto completo)' : ' (abono parcial)'}`).join(' · ');
    toast(`Pago registrado. Adelantó: ${resumen}.`);
  } else if (eraVencido) {
    showModal({
      title: 'Pago registrado — cliente cortado',
      body: `${cliente.nombres} ${cliente.apellidos} sigue suspendido. ¿Quieres reconectarlo ahora mismo, o solo registrar el pago y reconectarlo más adelante cuando lo pida?`,
      actions: [
        { label:'Reconectar ahora', cls:'', onClick: () => { ejecutarReconexion(reciboId); save('ordenes','recibos','clientes'); renderPage(); closeModal(); toast('Pago registrado y cliente reconectado.'); } },
        { label:'Solo registrar el pago', cls:'secondary', onClick: () => { closeModal(); toast('Pago registrado. El cliente sigue cortado hasta que se cree una orden de reconexión.'); } }
      ]
    });
  } else {
    toast('Pago registrado.');
  }
}
function intentarAnularPago(pagoId){
  const pago = getPago(pagoId); const recibo = getRecibo(pago.recibo_id);
  const generoReconexion = db.ordenes.some(o => o.tipo === 'reconexion' && o.recibo_id === recibo.id);
  if (generoReconexion) {
    showModal({ title:'Este pago generó una reconexión', body:'Al anularlo, ¿quieres solo corregir el registro del pago, o también cortar el servicio del cliente?',
      actions:[
        { label:'Solo corregir pago', cls:'secondary', onClick: () => { confirmarAnulacionPago(pagoId, false); closeModal(); } },
        { label:'Corregir y cortar servicio', cls:'danger', onClick: () => { confirmarAnulacionPago(pagoId, true); closeModal(); } },
        { label:'Cancelar', cls:'secondary', onClick: closeModal }
      ]});
  } else { confirmarAnulacionPago(pagoId, false); }
}
function confirmarAnulacionPago(pagoId, cortarServicio){
  const pago = getPago(pagoId); const recibo = getRecibo(pago.recibo_id);
  pago.estado = 'anulado'; pago.anulado_por = sesion.usuarioId; pago.fecha_anulacion = db.fechaActual; pago.motivo = 'Corrección registrada desde el panel';
  // Recalcula lo pagado del recibo sumando solo los pagos que siguen activos
  const pagosActivos = db.pagos.filter(p => p.recibo_id === recibo.id && p.estado === 'activo');
  recibo.monto_pagado = pagosActivos.reduce((s,p)=>s+p.monto, 0);
  recibo.estado = recibo.monto_pagado >= recibo.monto ? 'pagado' : (recibo.fecha_vencimiento < db.fechaActual ? 'vencido' : 'pendiente');
  if (cortarServicio) ejecutarCorteMoroso(recibo.id);
  save('ordenes','recibos','clientes'); renderAll();
  toast(cortarServicio ? 'Pago anulado y servicio cortado.' : 'Pago anulado. El servicio del cliente no fue modificado.');
}
function generarRecibosDelMes(){
  const periodo = db.fechaActual.slice(0,7);
  let creados = 0;
  let omitidos = 0;
  db.clientes.forEach(c => {
    if (db.recibos.some(r => r.cliente_codigo === c.codigo && r.periodo === periodo)) return;
    // No se factura a clientes retirados (baja definitiva), pendientes de instalación,
    // ni a los suspendidos por su propia voluntad — sí se sigue facturando a los
    // suspendidos por mora, porque continúan debiendo el servicio.
    if (c.estado === 'retirado' || c.estado === 'por_instalar' || (c.estado === 'suspendido' && c.motivo_corte === 'voluntario')) { omitidos++; return; }
    const plan = getPlan(c.plan_id);
    const recibo = { id: ++idSeq.recibo, cliente_codigo: c.codigo, periodo, monto: plan ? plan.precio : 0, monto_pagado: 0, fecha_vencimiento: calcularVencimiento(periodo), estado: 'pendiente' };
    db.recibos.push(recibo);
    aplicarSaldoAFavor(recibo);
    creados++;
  });
  save(); renderAll();
  toast(creados > 0 ? `${creados} recibo(s) generado(s) para ${periodo}.${omitidos>0?` (${omitidos} cliente(s) omitido(s) por estar retirados o en corte voluntario)`:''}` : `Ya existían recibos para este periodo.${omitidos>0?` ${omitidos} cliente(s) omitido(s) por estar retirados o en corte voluntario.`:''}`);
}

/* ---------------- ALMACÉN ---------------- */
function stockCentral(materialId){ return db.inventario_central[materialId] || 0; }
function stockSede(materialId, sedeId){ return db.inventario_sede[`${materialId}_${sedeId}`] || 0; }
function setStockSede(materialId, sedeId, cantidad){
  db.inventario_sede[`${materialId}_${sedeId}`] = Math.max(0, cantidad);
  if (supabaseClient && sesion) {
    supabaseClient.from('inventario_sede').upsert({ material_id: materialId, sede_id: sedeId, cantidad: Math.max(0, cantidad) }, { onConflict:'material_id,sede_id' }).then(({error}) => { if (error) console.error('Error sync inventario_sede:', error); });
  }
}
function setStockCentral(materialId, cantidad){
  db.inventario_central[materialId] = Math.max(0, cantidad);
  if (supabaseClient && sesion) {
    supabaseClient.from('inventario_central').upsert({ material_id: materialId, cantidad: Math.max(0, cantidad) }, { onConflict:'material_id' }).then(({error}) => { if (error) console.error('Error sync inventario_central:', error); });
  }
}
function registrarIngreso(materialId, cantidad, series){
  const material = getMaterial(materialId); const tipo = getTipoMaterial(material.tipo_material_id);
  const ingresoId = ++idSeq.ingreso;
  db.ingresos_almacen.push({ id: ingresoId, material_id: materialId, cantidad: tipo.es_serializado ? series.length : cantidad, fecha: db.fechaActual, registrado_por: sesion.usuarioId });
  if (tipo.es_serializado) series.forEach(serie => db.items_serializados.push({ id: ++idSeq.item, material_id: materialId, serie_mac: serie, sede_id: null, estado:'en_stock', orden_id:null, ingreso_id: ingresoId }));
  else setStockCentral(materialId, stockCentral(materialId) + cantidad);
  save('ingresos_almacen', 'items_serializados'); renderAll(); toast('Ingreso registrado en almacén central.');
}
function asignarMaterialASede(materialId, sedeId, cantidad, seriesElegidas){
  const material = getMaterial(materialId); const tipo = getTipoMaterial(material.tipo_material_id);
  const asignacionId = ++idSeq.asignacion;
  if (tipo.es_serializado) {
    seriesElegidas.forEach(itemId => {
      const item = db.items_serializados.find(i => i.id === itemId);
      if (item) { item.sede_id = sedeId; item.asignacion_id = asignacionId; }
    });
  } else {
    setStockCentral(materialId, stockCentral(materialId) - cantidad);
    setStockSede(materialId, sedeId, stockSede(materialId, sedeId) + cantidad);
  }
  db.asignaciones.push({ id: asignacionId, material_id: materialId, sede_id: sedeId, cantidad: tipo.es_serializado ? seriesElegidas.length : cantidad, fecha: db.fechaActual });
  save('asignaciones', 'items_serializados'); renderAll(); toast('Material asignado a la sede.');
}
function descontarMaterialDeOrden(ordenId, materialId, cantidad, itemId, cargoCliente, montoManual){
  const orden = getOrden(ordenId); const cliente = getCliente(orden.cliente_codigo);
  const material = getMaterial(materialId); const tipo = getTipoMaterial(material.tipo_material_id);
  const montoTotal = cargoCliente ? (montoManual || (material.precio_unitario||0) * cantidad) : 0;
  const consumo = { material_id: materialId, item_serializado_id: itemId||null, cantidad: tipo?.es_serializado ? 1 : cantidad, fecha: db.fechaActual, cargo_cliente: !!cargoCliente, precio_unitario: material.precio_unitario||0, monto_total: montoTotal };
  if (tipo?.es_serializado && itemId) {
    const item = db.items_serializados.find(i => i.id === itemId);
    if (item) { item.estado = 'instalado'; item.orden_id = ordenId; }
    orden.consumos.push({ ...consumo, id: ++idSeq.item });
  } else {
    setStockSede(materialId, cliente.sede_id, stockSede(materialId, cliente.sede_id) - cantidad);
    orden.consumos.push({ ...consumo, id: ++idSeq.item });
  }
  // Guardar consumo directamente en Supabase
  if (supabaseClient && sesion) {
    supabaseClient.from('orden_consumos').insert({ orden_id: ordenId, material_id: materialId, item_serializado_id: itemId||null, cantidad: consumo.cantidad, fecha: consumo.fecha, cargo_cliente: consumo.cargo_cliente, precio_unitario: consumo.precio_unitario, monto_total: consumo.monto_total }).then(({error}) => { if (error) console.error('Error guardando consumo:', error); });
  }
  save('ordenes', 'items_serializados'); renderAll(); toast(`Material descargado.${cargoCliente && montoTotal > 0 ? ` S/ ${montoTotal.toFixed(2)} a cobrar al cliente.` : ' Asumido por la empresa.'}`);
}

function agregarCargosAlRecibo(orden, totalCobrar){
  const cliente = getCliente(orden.cliente_codigo);
  const periodo = db.fechaActual.slice(0,7);
  let recibo = db.recibos.find(r => r.cliente_codigo === cliente.codigo && r.periodo === periodo);
  if (!recibo) {
    // crear recibo del mes si no existe
    const plan = getPlan(cliente.plan_id);
    recibo = { id: ++idSeq.recibo, cliente_codigo: cliente.codigo, periodo, monto: plan?plan.precio:0, monto_pagado:0, fecha_vencimiento: calcularVencimiento(periodo), estado:'pendiente', cargos_adicionales:[] };
    db.recibos.push(recibo);
  }
  if (!recibo.cargos_adicionales) recibo.cargos_adicionales = [];
  const conceptos = orden.consumos.filter(c=>c.cargo_cliente).map(c => `${getMaterial(c.material_id)?.nombre} x${c.cantidad}`).join(', ');
  recibo.cargos_adicionales.push({ orden_numero: orden.numero_correlativo, concepto: conceptos, monto: totalCobrar, fecha: db.fechaActual });
  recibo.monto += totalCobrar; // el recibo crece con el cargo
}

function generarReciboAdicional(orden, totalCobrar){
  const cliente = getCliente(orden.cliente_codigo);
  const conceptos = orden.consumos.filter(c=>c.cargo_cliente).map(c => `${getMaterial(c.material_id)?.nombre} x${c.cantidad}`).join(', ');
  const recibo = { id: ++idSeq.recibo, cliente_codigo: cliente.codigo, periodo: db.fechaActual.slice(0,7),
    monto: totalCobrar, monto_pagado:0, fecha_vencimiento: db.fechaActual, estado:'pendiente',
    es_adicional: true, concepto_adicional: `Materiales OS ${orden.numero_correlativo}: ${conceptos}`,
    cargos_adicionales: [{ orden_numero: orden.numero_correlativo, concepto: conceptos, monto: totalCobrar, fecha: db.fechaActual }]
  };
  db.recibos.push(recibo);
}

}
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }
function confirmarEliminar(msg, onConfirm){
  showModal({ title:'Confirmar eliminación', body:msg, actions:[
    { label:'Cancelar', cls:'secondary', onClick: closeModal },
    { label:'Eliminar', cls:'danger', onClick: () => { onConfirm(); closeModal(); } }
  ]});
}
function openFormModal({ title, note, fields, submitLabel='Guardar', onSubmit }){
  const fieldsHtml = fields.map(f => {
    if (f.type === 'select') return `<div class="field" style="margin-bottom:12px;"><label>${f.label}</label><select id="mf_${f.name}">${f.options.map(o=>`<option value="${o.value}" ${String(o.value)===String(f.value)?'selected':''}>${o.label}</option>`).join('')}</select></div>`;
    if (f.type === 'checkbox') return `<div class="field" style="margin-bottom:12px;"><label><input type="checkbox" id="mf_${f.name}" ${f.value?'checked':''} style="width:auto; margin-right:6px;">${f.label}</label></div>`;
    return `<div class="field" style="margin-bottom:12px;"><label>${f.label}</label><input id="mf_${f.name}" type="${f.type||'text'}" value="${f.value!=null?f.value:''}" placeholder="${f.placeholder||''}"></div>`;
  }).join('');
  document.getElementById('modalRoot').innerHTML = `<div class="modal-bg"><div class="modal">
      <h3>${title}</h3>${note ? `<p>${note}</p>` : ''}<div>${fieldsHtml}</div>
      <div class="actions" style="margin-top:8px;"><button class="btn secondary" id="mfCancel">Cancelar</button><button class="btn" id="mfSubmit">${submitLabel}</button></div>
    </div></div>`;
  document.getElementById('mfCancel').onclick = closeModal;
  document.getElementById('mfSubmit').onclick = () => {
    const values = {};
    const btn = document.getElementById('mfSubmit');
    fields.forEach(f => {
      const el = document.getElementById('mf_'+f.name);
      if (f.type === 'checkbox') values[f.name] = el.checked;
      else if (f.type === 'number') values[f.name] = Number(el.value);
      else values[f.name] = el.value;
    });
    onSubmit(values, btn);
  };
}

========================================================= */
function spHTML(id, items, selectedId, placeholder){
  const sel = items.find(it => String(it.id) === String(selectedId));
  return `<div class="sp" id="${id}">
    <input type="text" class="sp-input" autocomplete="off" placeholder="${placeholder||'Escribe para buscar...'}" value="${sel ? sel.label.replace(/"/g,'&quot;') : ''}">
    <input type="hidden" class="sp-value" value="${selectedId||''}">
    <div class="sp-list"></div>
  </div>`;
}
function spInit(id, items, onChange){
  const root = document.getElementById(id);
  if (!root) return;
  const input = root.querySelector('.sp-input');
  const hidden = root.querySelector('.sp-value');
  const list = root.querySelector('.sp-list');
  function render(query){
    const q = norm(query);
    const filtered = (q ? items.filter(it => norm(it.label).includes(q) || (it.sub && norm(it.sub).includes(q))) : items).slice(0,10);
    list.innerHTML = filtered.map(it => `<div class="sp-item" data-id="${it.id}">${it.label}${it.sub?`<span class="s">${it.sub}</span>`:''}</div>`).join('') || '<div class="sp-empty">Sin resultados</div>';
    list.style.display = 'block';
  }
  input.addEventListener('focus', () => render(input.value));
  input.addEventListener('input', () => { hidden.value=''; if (onChange) onChange(''); render(input.value); });
  list.addEventListener('mousedown', (e) => {
    const item = e.target.closest('.sp-item'); if (!item) return;
    e.preventDefault(); // evita que el blur del input cierre la lista antes del click
    hidden.value = item.dataset.id;
    input.value = items.find(it => String(it.id)===String(item.dataset.id))?.label || '';
    list.style.display = 'none';
    if (onChange) onChange(item.dataset.id);
  });
  input.addEventListener('blur', () => { setTimeout(() => { list.style.display = 'none'; }, 150); });
}
function spValue(id){ const el = document.querySelector('#'+id+' .sp-value'); return el ? el.value : ''; }

function clientesAsItems(lista){ return (lista||db.clientes).map(c => ({ id:c.codigo, label:`#${c.codigo} — ${c.nombres} ${c.apellidos}`, sub:`${c.dni}${c.direccion?' · '+c.direccion:''}` })); }

let pag = { clientes:1, ordenes:1, materiales:1, movimientos:1 };
function pagerHTML(key, totalItems){
  const totalPages = Math.max(1, Math.ceil(totalItems / PER_PAGE));
  if (pag[key] > totalPages) pag[key] = totalPages;
  if (pag[key] < 1) pag[key] = 1;
  return `<div class="pager"><button class="btn secondary" id="pagPrev_${key}" ${pag[key]<=1?'disabled':''}>← Anterior</button>
    <span class="pager-info">Página ${pag[key]} de ${totalPages} · ${totalItems} registro(s)</span>
    <button class="btn secondary" id="pagNext_${key}" ${pag[key]>=totalPages?'disabled':''}>Siguiente →</button></div>`;
}
function pagerBind(key, onChange){
  const prev = document.getElementById('pagPrev_'+key), next = document.getElementById('pagNext_'+key);
  if (prev) prev.onclick = () => { pag[key]--; onChange(); };
  if (next) next.onclick = () => { pag[key]++; onChange(); };
}
function pageSlice(key, arr){ return arr.slice((pag[key]-1)*PER_PAGE, pag[key]*PER_PAGE); }

========================================================= */
let filtrosClientes = { q:'', sede_id:'', estado:'', sector_id:'' };
let filtrosOrdenes = { sede_id:'', tipo:'', clase_servicio:'', estado:'', tecnico_id:'', vendedor_id:'', sector_id:'', cliente_q:'', fecha_ini:'', fecha_fin:'' };

function aplicarFiltrosClientes(){
  let lista = db.clientes.slice();
  if (sesion.rol === 'tecnico') { const t = getUsuario(sesion.usuarioId); lista = lista.filter(c => c.sede_id === t?.sede_id); }
  const f = filtrosClientes;
  if (f.q) { const q = norm(f.q); lista = lista.filter(c => norm(c.nombres+' '+c.apellidos).includes(q) || norm(c.dni).includes(q) || String(c.codigo).includes(q)); }
  if (f.sede_id) lista = lista.filter(c => c.sede_id === Number(f.sede_id));
  if (f.estado) lista = lista.filter(c => c.estado === f.estado);
  if (f.sector_id) lista = lista.filter(c => c.sector_id === Number(f.sector_id));
  return lista;
}
function aplicarFiltrosOrdenes(){
  let lista = sesion.rol === 'tecnico' ? db.ordenes.filter(o => o.tecnico_id === sesion.usuarioId) : db.ordenes.slice();
  const f = filtrosOrdenes;
  if (f.sede_id) lista = lista.filter(o => getCliente(o.cliente_codigo)?.sede_id === Number(f.sede_id));
  if (f.tipo) lista = lista.filter(o => o.tipo === f.tipo);
  if (f.clase_servicio) lista = lista.filter(o => o.clase_servicio === f.clase_servicio);
  if (f.estado) lista = lista.filter(o => o.estado === f.estado);
  if (f.tecnico_id) lista = lista.filter(o => o.tecnico_id === f.tecnico_id);
  if (f.vendedor_id) lista = lista.filter(o => o.vendedor_id === f.vendedor_id);
  if (f.sector_id) lista = lista.filter(o => o.sector_id === Number(f.sector_id));
  if (f.cliente_q) { const q = norm(f.cliente_q); lista = lista.filter(o => { const c=getCliente(o.cliente_codigo); return c && (norm(c.nombres+' '+c.apellidos).includes(q) || String(c.codigo).includes(q)); }); }
  if (f.fecha_ini) lista = lista.filter(o => o.fecha_creacion >= f.fecha_ini);
  if (f.fecha_fin) lista = lista.filter(o => o.fecha_creacion <= f.fecha_fin);
  return lista;
}

function renderLogin(){
  document.getElementById('root').innerHTML = `
    <div class="login-screen"><div class="login-card">
      <img src="${LOGO_B64}" alt="Redify Perú"><div class="login-stripe"></div>
      <form id="formLogin">
        <div class="field"><label>Correo electrónico</label><input type="email" id="loginEmail" placeholder="admin@redify.pe" autocomplete="email"></div>
        <div class="field"><label>Contraseña</label><input type="password" id="loginPassword" placeholder="••••" autocomplete="current-password"></div>
        <button class="btn-login" type="submit" id="btnLogin">Ingresar al panel</button>
      </form>
      <p class="login-hint" id="loginMsg"></p>
    </div></div>`;
  if (!supabaseClient) {
    const msg = document.getElementById('loginMsg');
    msg.dataset.supabaseWarning = 'true';
    msg.textContent = 'Cargando conexion con Supabase...';
  }
  document.getElementById('formLogin').onsubmit = async (e) => {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim();
    const pass = document.getElementById('loginPassword').value;
    const btn = document.getElementById('btnLogin');
    const msg = document.getElementById('loginMsg');
    btn.textContent = 'Ingresando...'; btn.disabled = true;
    msg.textContent = '';
    window.initSupabase();
    if (!supabaseClient) {
      msg.textContent = 'No se pudo cargar Supabase. No es posible iniciar sesion.';
      btn.textContent = 'Ingresar al panel'; btn.disabled = false; return;
    }
    try {
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: pass });
      if (error) { msg.textContent = 'Correo o contraseña incorrectos.'; btn.textContent = 'Ingresar al panel'; btn.disabled = false; return; }
      // Buscar usuario en la tabla usuarios por UUID de Supabase Auth
      let { data: usuario, error: errU } = await supabaseClient.from('usuarios').select('*').eq('email', email).maybeSingle();
      if (!usuario) {
        const porId = await supabaseClient.from('usuarios').select('*').eq('id', data.user.id).maybeSingle();
        usuario = porId.data; errU = porId.error;
      }
      if (errU || !usuario || usuario.activo === false) { msg.textContent = 'Usuario no registrado o inactivo en el panel.'; await supabaseClient.auth.signOut(); btn.textContent = 'Ingresar al panel'; btn.disabled = false; return; }
      // Buscar el usuario local por email como fallback o crear sesión
      let usuarioLocal = usuario;
      if (!usuarioLocal) {
        // Crear usuario local si no existe (sincronización)
        usuarioLocal = { id: data.user.id, nombre: usuario.nombre, email: usuario.email, rol: usuario.rol, password: '', sede_id: usuario.sede_id || null, activo: true };
        db.usuarios.push(usuarioLocal);
        save();
      }
      sesion = { usuarioId: usuarioLocal.id, rol: usuarioLocal.rol };
      msg.textContent = 'Cargando datos del panel...';
      await loadCloudDb();
      if (!db.usuarios.some(u => u.id === usuarioLocal.id)) db.usuarios.push(usuarioLocal);
      save(); nav = { view:'inicio', params:{} };
      iniciarRealtime();
      render();
    } catch(err) {
      msg.textContent = 'Error de conexión. Verifica tu internet.';
      btn.textContent = 'Ingresar al panel'; btn.disabled = false;
    }
  };
}

function viewIsActive(view){ return nav.view === view; }
function groupHasActive(group){ return group.children.some(c => c.view === nav.view); }

function renderShell(){

      </aside>
      <main>

      </main>
    </div>`;

function renderMenu(){
  const menuEl = document.getElementById('menu'); menuEl.innerHTML = '';
  MENU.forEach(item => {
    if (item.perm && !puede(item.perm)) return;
    if (item.type === 'single') {
      const a = document.createElement('div'); a.className = 'menu-single' + (viewIsActive(item.view) ? ' active' : '');
      a.innerHTML = `<span class="ic">${item.icon}</span> ${item.label}`; a.onclick = () => goTo(item.view); menuEl.appendChild(a); return;
    }
    const children = item.children.filter(c => !c.perm || puede(c.perm));
    if (children.length === 0) return;
    const anyExplicitOpen = Object.values(openGroups).some(v => v);
    const isOpen = openGroups[item.key] || (!anyExplicitOpen && nav.view !== 'inicio' && groupHasActive(item));
    const group = document.createElement('div');
    const parent = document.createElement('button');
    parent.className = 'menu-parent' + (isOpen ? ' open' : '') + (groupHasActive(item) ? ' has-active' : '');
    parent.innerHTML = `<span class="ic">${item.icon}</span> ${item.label} <span class="chev">▶</span>`;
    parent.onclick = () => {
      const wasOpen = openGroups[item.key];
      // Cerrar todos los grupos
      Object.keys(openGroups).forEach(k => { openGroups[k] = false; });
      // Abrir solo este si estaba cerrado
      openGroups[item.key] = !wasOpen;
      renderMenu();
    };
    group.appendChild(parent);
    const sub = document.createElement('div'); sub.className = 'submenu' + (isOpen ? ' open' : '');
    children.forEach(c => { const link = document.createElement('div'); link.className = 'sublink' + (viewIsActive(c.view) ? ' active' : ''); link.textContent = c.label; link.onclick = () => goTo(c.view); sub.appendChild(link); });
    group.appendChild(sub); menuEl.appendChild(group);
  });
}

function tipoOrdenBadge(tipo){

  const labels = { traslado_domicilio:'traslado domicilio', traslado_interno:'traslado interno', cambio_plan:'cambio de plan',
    cambio_equipo:'cambio de equipo', retiro_equipo:'retiro de equipo', corte_voluntario:'corte voluntario', corte_moroso:'corte moroso' };
  return `<span class="badge ${map[tipo]||'gray'}">${labels[tipo]||tipo}</span>`;
}

    const cliente = getCliente(Number(clienteId));
    const f = new FormData(e.target);
    const tecId = spValue('spOrdTecnico') || (sesion.rol === 'tecnico' ? sesion.usuarioId : null);
    const tipo = f.get('tipo');

    let descripcion = f.get('descripcion');
    // corte_voluntario, corte_moroso (manual) y reconexion (manual) YA NO aplican su efecto aquí —
    // se aplican en aplicarEfectoCierreOrden() cuando la orden se descarga/cierra.
    if (tipo === 'retiro_equipo') {
      const estadoAnterior = cliente.estado; cliente.estado = 'retirado'; cliente.motivo_corte = null;
      registrarLogCliente(cliente.codigo, 'Estado', estadoAnterior, 'retirado (baja definitiva)');
    } else if (tipo === 'cambio_plan') {
      const planNuevoId = Number(document.getElementById('selNuevoPlan').value);
      const planAnterior = getPlan(cliente.plan_id)?.nombre; const planNuevo = getPlan(planNuevoId)?.nombre;
      cliente.plan_id = planNuevoId;
      registrarLogCliente(cliente.codigo, 'Plan', planAnterior, planNuevo);
      descripcion = descripcion || `Cambio de plan: ${planAnterior} → ${planNuevo}`;
    } else if (tipo === 'traslado_domicilio' || tipo === 'traslado_interno') {
      const nuevaDir = document.getElementById('inpNuevaDireccion').value;
      if (nuevaDir) { registrarLogCliente(cliente.codigo, 'Dirección', cliente.direccion, nuevaDir); cliente.direccion = nuevaDir; }
    }

    const orden = crearOrden({
      tipo, cliente_codigo: cliente.codigo, tecnico_id: tecId||null, descripcion,
      clase_servicio: tipo==='soporte' ? document.getElementById('selClaseServicio').value : null,
      motivo_id: tipo==='soporte' ? Number(document.getElementById('selMotivo').value) : null,
      sector_id: f.get('sector_id') ? Number(f.get('sector_id')) : null
    });
    save('ordenes'); toast(`Orden ${orden.numero_correlativo} creada.`); goTo('ordenes.listado');
  };
}

function renderOrdenesReporte(page){

    <div class="card">
      <div class="table-wrap"><table><thead><tr><th>Orden</th><th>Cliente</th><th>Sede</th><th>Usuario PPPoE</th><th>Conectado</th></tr></thead>
        <tbody id="reporteBody">${ordenesHoy.map(o => { const cliente=getCliente(o.cliente_codigo);
          return `<tr data-row="${o.id}"><td class="mono-cell">${o.numero_correlativo}</td><td>${cliente?cliente.nombres+' '+cliente.apellidos:'—'}</td><td>${getSede(cliente?.sede_id)?.nombre||'—'}</td><td class="mono-cell">${cliente?.pppoe_user||'—'}</td><td><span class="badge gray">verificando...</span></td></tr>`; }).join('')}
        </tbody></table>${ordenesHoy.length===0?'<div class="empty">No hubo reconexiones el día de hoy.</div>':''}</div>
    </div>`;
  // Verificar estado real por sede
  ordenesHoy.forEach(async o => {
    const cliente = getCliente(o.cliente_codigo);
    const sede = getSede(cliente?.sede_id);
    const td = page.querySelector(`tr[data-row="${o.id}"] td:last-child`);
    if (!td) return;
    if (sede?.mikrotik_sede_id && db.backendUrl) {
      const activos = await mikrotikListarActivos(sede);
      if (activos === null) { td.innerHTML = '<span class="badge gray">backend no disponible</span>'; return; }
      const conectado = activos.some(a => a.nombre === cliente.pppoe_user);

    } else {
      td.innerHTML = (o.id%5)!==0 ? '<span class="badge green">sí (sim.)</span>' : '<span class="badge amber">no verificado</span>';
    }
  });
}

function renderOrdenDescargar(page){

    <div class="grid2">

        <h3>Material a descargar <span class="tag">${orden.consumos.length} registrado(s)</span></h3>
        ${editable ? `
        <div class="form-row">
          <div class="field"><label>Material</label>${spHTML('spConsumoMaterial', materialesAsItems(), '', 'Busca material...')}</div>
        </div>
        <div id="detalleConsumo" class="form-row"></div>
        <div class="form-row" id="filaCargoCosto" style="display:none;">
          <div class="field"><label>¿Quién asume el costo?</label>
            <select id="selCargoCosto">
              <option value="empresa">Empresa (sin cobro al cliente)</option>
              <option value="cliente">Cliente (se cobrará aparte)</option>
            </select>
          </div>
          <div class="field" id="filaMontoCargo" style="display:none;"><label>Monto a cobrar S/</label><input type="number" id="inpMontoCargo" min="0" step="0.01" value="0"></div>
        </div>
        <button class="btn secondary" id="btnAgregarConsumo" type="button">+ Agregar material</button>
        <hr style="border:none; border-top:1px solid var(--border); margin:16px 0;">` : ''}
        <div class="table-wrap"><table><thead><tr><th>Material</th><th>Detalle</th><th>Cargo</th></tr></thead>
          <tbody>${orden.consumos.map(c => { const item = c.item_serializado_id ? db.items_serializados.find(i=>i.id===c.item_serializado_id) : null;
            return `<tr><td>${getMaterial(c.material_id)?.nombre}</td>
              <td class="mono-cell">${item ? 'Serie: '+item.serie_mac : 'Cant: '+c.cantidad}</td>
              <td>${c.cargo_cliente ? `<span class="badge amber">cliente S/ ${(c.monto_total||0).toFixed(2)}</span>` : '<span class="badge gray">empresa</span>'}</td>
            </tr>`; }).join('')}</tbody></table>
          ${orden.consumos.length===0 ? '<div class="empty">Sin material registrado aún.</div>' : ''}
        </div>
        ${totalCobrable > 0 ? `<div class="info-note" style="margin-top:12px;">Total a cobrar al cliente por materiales: <b>S/ ${totalCobrable.toFixed(2)}</b></div>` : ''}
      </div>
      <div class="card">
        <h3>Comentario de cierre</h3>
        <p class="desc" style="margin-bottom:14px;">Lo que el técnico encontró o realizó — quedará impreso en el comprobante.</p>
        <textarea id="comentarioCierre" rows="6" style="width:100%;" placeholder="Ej. Se instaló ONU en sala, se hizo prueba de velocidad, cliente conforme..." ${!editable?'disabled':''}>${orden.comentario_cierre||''}</textarea>

          ${editable ? `<button class="btn" id="btnConfirmarCierre">${orden.estado==='abierta' ? 'Descargar orden' : 'Guardar comentario'}</button>` : ''}
          ${orden.estado === 'cerrada' ? `<button class="btn secondary" id="btnIrImprimir">Ver comprobante / Imprimir</button>` : ''}
        </div>
      </div>
    </div>`;

  document.getElementById('volverListado').onclick = () => goTo('ordenes.listado');

  if (editable) {
    spInit('spConsumoMaterial', materialesAsItems(), (matId) => {
      const info = disponibles.find(d => String(d.material.id) === String(matId));
      const cont = document.getElementById('detalleConsumo');
      const filaCosto = document.getElementById('filaCargoCosto');
      if (!info) { cont.innerHTML = ''; filaCosto.style.display='none'; return; }
      filaCosto.style.display = 'grid';
      const precioRef = info.material.precio_unitario || 0;
      cont.innerHTML = info.tipo.es_serializado
        ? `<div class="field"><label>Serie / MAC</label><select id="selSerieConsumo">${info.items.map(i=>`<option value="${i.id}">${i.serie_mac}</option>`).join('') || '<option value="">Sin stock en esta sede</option>'}</select></div>`
        : `<div class="field"><label>Cantidad (stock: ${info.stock})</label><input type="number" id="inpCantidadConsumo" min="1" max="${info.stock}" value="1"></div>`;

        } else { filaMonto.style.display = 'none'; }
      };
    });

    document.getElementById('btnAgregarConsumo').onclick = () => {
      const matId = spValue('spConsumoMaterial'); if (!matId) { toast('Selecciona un material.'); return; }
      const info = disponibles.find(d => String(d.material.id) === String(matId));
      const cargoCliente = document.getElementById('selCargoCosto').value === 'cliente';
      const montoManual = cargoCliente ? (Number(document.getElementById('inpMontoCargo')?.value) || 0) : 0;
      if (info.tipo.es_serializado) {
        const itemId = Number(document.getElementById('selSerieConsumo').value);
        if (!itemId) { toast('No hay series disponibles en esta sede.'); return; }
        descontarMaterialDeOrden(orden.id, Number(matId), 1, itemId, cargoCliente, montoManual);
      } else {
        const cant = Number(document.getElementById('inpCantidadConsumo').value);
        descontarMaterialDeOrden(orden.id, Number(matId), cant, null, cargoCliente, montoManual);
      }
      goTo('ordenes.descargar', { id: orden.id });
    };

    document.getElementById('btnConfirmarCierre').onclick = () => {
      const comentario = document.getElementById('comentarioCierre').value;
      if (orden.estado === 'abierta' && !comentario.trim()) { toast('Escribe un comentario antes de descargar la orden.'); return; }

      const totalCobrar = orden.consumos.filter(c=>c.cargo_cliente).reduce((s,c)=>s+(c.monto_total||0),0);

      if (totalCobrar > 0) {
        // Preguntar cómo cobrar los materiales al cliente
        showModal({
          title: `Cobro al cliente — S/ ${totalCobrar.toFixed(2)}`,
          body: `Esta orden tiene materiales a cobrar al cliente por S/ ${totalCobrar.toFixed(2)}. ¿Cómo quieres registrar este cobro?`,
          actions: [
            { label: 'Agregar al recibo del mes', cls:'', onClick: () => {
              cerrarOrden(orden.id, comentario);
              agregarCargosAlRecibo(orden, totalCobrar);
              save('ordenes','recibos','clientes'); closeModal(); toast(`Orden descargada. S/ ${totalCobrar.toFixed(2)} agregado al recibo del mes.`);
              goTo('ordenes.imprimir', { id: orden.id });
            }},
            { label: 'Recibo separado', cls:'secondary', onClick: () => {
              cerrarOrden(orden.id, comentario);
              generarReciboAdicional(orden, totalCobrar);
              save('ordenes','recibos','clientes'); closeModal(); toast(`Orden descargada. Recibo separado por S/ ${totalCobrar.toFixed(2)} generado.`);
              goTo('ordenes.imprimir', { id: orden.id });
            }},
            { label: 'Cerrar sin cobrar ahora', cls:'secondary', onClick: () => {
              cerrarOrden(orden.id, comentario);
              save('ordenes','recibos','clientes'); closeModal(); toast(`Orden descargada. El cobro de materiales queda pendiente.`);
              goTo('ordenes.imprimir', { id: orden.id });
            }}
          ]
        });
      } else {
        cerrarOrden(orden.id, comentario);
        save('ordenes','recibos','clientes'); toast(`Orden ${orden.numero_correlativo} descargada.`);
        goTo('ordenes.imprimir', { id: orden.id });
      }
    };
  }
  const btnIr = document.getElementById('btnIrImprimir'); if (btnIr) btnIr.onclick = () => goTo('ordenes.imprimir', { id: orden.id });
}

function abrirModalMaterial(id){
  const m = id ? getMaterial(id) : null;
  function fieldsForTipo(tipoId, valores={}){ const tipo = getTipoMaterial(tipoId); return (tipo.campos_extra||[]).map(c => `<div class="field" style="margin-bottom:12px;"><label>${c}</label><input id="mat_attr_${c}" placeholder="${c}" value="${valores[c]||''}"></div>`).join(''); }
  const tipoInicial = m ? m.tipo_material_id : db.tipos_material[0]?.id;
  document.getElementById('modalRoot').innerHTML = `<div class="modal-bg"><div class="modal">
      <h3>${m ? `Editar "${m.nombre}"` : 'Nuevo material'}</h3>
      <div class="field" style="margin-bottom:12px;"><label>Tipo de material</label><select id="selTipoNuevoMaterial" ${m?'disabled':''}>${db.tipos_material.map(t=>`<option value="${t.id}" ${t.id===tipoInicial?'selected':''}>${t.nombre}</option>`).join('')}</select></div>
      <div class="field" style="margin-bottom:12px;"><label>Nombre del material</label><input id="inpNombreMaterial" placeholder="Ej. ONU Huawei HG8245" value="${m?.nombre||''}"></div>
      <div class="field" style="margin-bottom:12px;"><label>Precio unitario (S/) — para cobrar al cliente</label><input type="number" id="inpPrecioMaterial" min="0" step="0.01" placeholder="0.00" value="${m?.precio_unitario||0}"></div>
      <div id="camposExtraMaterial">${fieldsForTipo(tipoInicial, m?.atributos||{})}</div>
      <div class="actions" style="margin-top:8px;"><button class="btn secondary" id="btnCancelarMaterial">Cancelar</button><button class="btn" id="btnConfirmarMaterial">${m?'Guardar cambios':'Crear material'}</button></div>
    </div></div>`;
  if (!m) document.getElementById('selTipoNuevoMaterial').onchange = (e) => { document.getElementById('camposExtraMaterial').innerHTML = fieldsForTipo(Number(e.target.value)); };
  document.getElementById('btnCancelarMaterial').onclick = closeModal;
  document.getElementById('btnConfirmarMaterial').onclick = () => {
    const tipoId = Number(document.getElementById('selTipoNuevoMaterial').value);
    const nombre = document.getElementById('inpNombreMaterial').value.trim(); if (!nombre) { toast('El nombre es obligatorio.'); return; }
    const precio = Number(document.getElementById('inpPrecioMaterial').value) || 0;
    const tipo = getTipoMaterial(tipoId); const atributos = {}; (tipo.campos_extra||[]).forEach(c => { atributos[c] = document.getElementById('mat_attr_'+c)?.value || ''; });
    if (m) { m.nombre = nombre; m.atributos = atributos; m.precio_unitario = precio; }
    else db.materiales.push({ id:nextId(db.materiales), tipo_material_id:tipoId, nombre, atributos, precio_unitario: precio });
    save('materiales'); closeModal(); renderPage(); toast(m?'Material actualizado.':`Material "${nombre}" creado.`);
  };
}

    <div class="grid2">

          <button class="btn" type="submit">Registrar ingreso</button>

      </div>
      <div class="card"><h3>Stock en almacén central <span class="tag">sin sede asignar</span></h3>
        <div class="table-wrap"><table><thead><tr><th>Material</th><th>Disponible</th><th>Estado</th></tr></thead>
          <tbody>${db.materiales.map(m => { const tipo = getTipoMaterial(m.tipo_material_id);

            return `<tr><td>${m.nombre}</td><td class="mono-cell">${cant}${tipo.es_serializado ? ' (series)' : ' ' + tipo.unidad}</td><td>${stockAlertaBadge(cant)}</td></tr>`; }).join('')}</tbody></table>

        ? `<div class="field" style="margin-bottom:12px;"><label>Series / MAC (separadas por coma)</label><input id="inpSeriesIngreso" placeholder="HW001, HW002, HW003"></div>`

    });
    form.onsubmit = (e) => { e.preventDefault();

      if (tipo.es_serializado) { const series = document.getElementById('inpSeriesIngreso').value.split(',').map(s=>s.trim()).filter(Boolean);
        if (series.length===0) { toast('Ingresa al menos una serie/MAC.'); return; } registrarIngreso(Number(matId), 0, series); }
      else registrarIngreso(Number(matId), Number(document.getElementById('inpCantidadIngreso').value), []);

function renderLogisticaAsignacion(page){
  page.innerHTML = `
    ${pageHead('Asignación a sede', 'Mueve material del almacén central a la sede donde se va a usar.')}
    <div class="card" style="max-width:640px;">
      ${db.materiales.length===0 ? '<p class="desc">Crea un material primero.</p>' : `
      <form id="formAsignacion">
        <div class="field" style="margin-bottom:12px;"><label>Material</label>${spHTML('spMaterialAsig', materialesAsItems(), '', 'Busca material...')}</div>
        <div class="field" style="margin-bottom:12px;"><label>Sede destino</label><select name="sede_id">${db.sedes.map(s=>`<option value="${s.id}">${s.nombre}</option>`).join('')}</select></div>
        <div id="campoAsignacion"></div>
        <button class="btn" type="submit">Asignar</button>
      </form>`}
    </div>`;
  const form = document.getElementById('formAsignacion');
  if (form) {
    function renderCampo(matId){
      const cont = document.getElementById('campoAsignacion'); if (!matId) { cont.innerHTML=''; return; }
      const tipo = getTipoMaterial(getMaterial(Number(matId)).tipo_material_id);
      if (tipo.es_serializado) {
        const disp = db.items_serializados.filter(i => i.material_id===Number(matId) && i.sede_id===null && i.estado==='en_stock');
        cont.innerHTML = `<div class="field" style="margin-bottom:6px;"><label>Series disponibles en central (${disp.length})</label><input id="filtroSeries" placeholder="Filtrar por serie..."></div>
          <div class="checklist-box" id="listaSeries">${disp.map(i=>`<label class="checklist-item"><input type="checkbox" value="${i.id}"> <span class="mono-cell">${i.serie_mac}</span></label>`).join('') || '<div class="checklist-item">Sin stock en central</div>'}</div>`;
        const filtro = document.getElementById('filtroSeries');
        filtro.oninput = () => { const q = norm(filtro.value); document.querySelectorAll('#listaSeries .checklist-item').forEach(it => { it.style.display = norm(it.textContent).includes(q) ? 'flex' : 'none'; }); };
      } else cont.innerHTML = `<div class="field" style="margin-bottom:12px;"><label>Cantidad (disponible: ${stockCentral(Number(matId))})</label><input type="number" id="inpCantidadAsig" min="1" max="${stockCentral(Number(matId))}" value="1"></div>`;
    }
    spInit('spMaterialAsig', materialesAsItems(), renderCampo);
    form.onsubmit = (e) => { e.preventDefault();
      const matId = spValue('spMaterialAsig'); if (!matId) { toast('Selecciona un material.'); return; }
      const f = new FormData(e.target); const sedeId = Number(f.get('sede_id'));
      const tipo = getTipoMaterial(getMaterial(Number(matId)).tipo_material_id);
      if (tipo.es_serializado) { const ids = Array.from(document.querySelectorAll('#listaSeries input:checked')).map(i=>Number(i.value));

      else asignarMaterialASede(Number(matId), sedeId, Number(document.getElementById('inpCantidadAsig').value), []);
      goTo('logistica.asignacion');
    };
  }
}

      <h3>Umbral de stock mínimo</h3>
      <div class="form-row"><div class="field"><label>Cantidad mínima antes de alertar</label><input type="number" id="inpStockMinimo" min="0" value="${db.stock_minimo}"></div></div>
      <button class="btn secondary" id="btnGuardarMinimo">Guardar</button>

        <tbody>${db.sedes.flatMap(sede => db.materiales.map(m => { const tipo = getTipoMaterial(m.tipo_material_id);
          const cant = tipo?.es_serializado ? db.items_serializados.filter(i => i.material_id===m.id && i.sede_id===sede.id && i.estado==='en_stock').length : stockSede(m.id, sede.id);
