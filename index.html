          return `<tr><td>${m.nombre}</td><td>${sede.nombre}</td><td class="mono-cell">${cant}${tipo?.es_serializado ? ' unid.' : ' ' + (tipo?.unidad||'')}</td><td>${stockAlertaBadge(cant)}</td><td>${btnSeries}</td></tr>`; })).join('')}
        </tbody></table></div></div>

    const matId = Number(b.dataset.mat); const sedeId = Number(b.dataset.sede);
    const material = getMaterial(matId); const sede = getSede(sedeId);

    document.getElementById('modalRoot').innerHTML = `<div class="modal-bg"><div class="modal">

      <p class="desc" style="margin-bottom:12px;">Sede: <b>${sede?.nombre}</b> · ${items.length} unidad(es) disponible(s)</p>
      <div class="table-wrap"><table><thead><tr><th>#</th><th>Serie / MAC</th></tr></thead>
        <tbody>${items.map((it,idx) => `<tr><td class="mono-cell">${idx+1}</td><td class="mono-cell">${it.serie_mac}</td></tr>`).join('')}</tbody>
      </table>${items.length===0 ? '<div class="empty">Sin series en stock en esta sede.</div>' : ''}</div>
      <div class="actions" style="margin-top:16px;"><button class="btn secondary" id="btnCerrarSeries">Cerrar</button></div>
    </div></div>`;
    document.getElementById('btnCerrarSeries').onclick = closeModal;
  });
}
function stockAlertaBadge(cantidad){
  if (cantidad <= 0) return '<span class="badge red">sin stock</span>';
  if (cantidad <= db.stock_minimo) return '<span class="badge red">bajo (≤'+db.stock_minimo+')</span>';
  if (cantidad <= db.stock_minimo * 2) return '<span class="badge amber">ajustado</span>';
  return '<span class="badge green">ok</span>';
}

function renderLogisticaEquipos(page){
  const q = nav.params.q || '';
  page.innerHTML = `
    ${pageHead('Gestión de Equipos', 'Busca un equipo por su serie o MAC y revisa todo su historial: ingreso, asignación, instalación y estado actual.')}
    <div class="filter-panel">
      <div class="filter-grid"><div class="field" style="grid-column:1/-1;"><label>Serie / MAC</label><input id="inpBuscarSerie" value="${q}" placeholder="Ej. HW001"></div></div>
      <button class="btn" id="btnBuscarSerie">Buscar</button>
    </div>
    <div id="resultadoEquipo"></div>`;
  document.getElementById('btnBuscarSerie').onclick = () => goTo('logistica.equipos', { q: document.getElementById('inpBuscarSerie').value.trim() });

  const cont = document.getElementById('resultadoEquipo');
  if (!q) { cont.innerHTML = '<div class="card"><div class="empty">Escribe una serie o MAC para ver su historial.</div></div>'; return; }

  const item = db.items_serializados.find(i => norm(i.serie_mac) === norm(q));
  if (!item) {
    const sugerencias = db.items_serializados.filter(i => norm(i.serie_mac).includes(norm(q))).slice(0,8);
    cont.innerHTML = `<div class="card"><div class="empty">No se encontró un equipo con esa serie exacta.</div>
      ${sugerencias.length ? `<p class="desc" style="margin-bottom:10px;">¿Quisiste decir alguna de estas?</p><div class="chip-list">${sugerencias.map(s=>`<span class="chip rowlink" data-s="${s.serie_mac}" style="cursor:pointer;">${s.serie_mac}</span>`).join('')}</div>` : ''}</div>`;
    cont.querySelectorAll('[data-s]').forEach(el => el.onclick = () => goTo('logistica.equipos', { q: el.dataset.s }));
    return;
  }

  const material = getMaterial(item.material_id);
  const ingreso = db.ingresos_almacen.find(i => i.material_id === item.material_id);
  const asignacion = item.sede_id ? db.asignaciones.filter(a => a.material_id === item.material_id && a.sede_id === item.sede_id).slice(-1)[0] : null;
  const ordenInstalacion = item.orden_id ? getOrden(item.orden_id) : null;
  const clienteInstalado = ordenInstalacion ? getCliente(ordenInstalacion.cliente_codigo) : null;

  const estadoMap = { en_stock:'green', asignado:'blue', instalado:'purple', dañado:'red' };
  cont.innerHTML = `
    <div class="card" style="max-width:760px;">
      <div class="btn-row" style="margin-bottom:6px;"><h3 style="margin:0;">${material?.nombre} — <span class="mono-cell">${item.serie_mac}</span></h3>
        <span class="badge ${estadoMap[item.estado]||'gray'}">${item.estado.replace('_',' ')}</span></div>
      <p class="desc">Sede actual: ${item.sede_id ? getSede(item.sede_id)?.nombre : 'Almacén central'}</p>
    </div>
    <div class="card" style="max-width:760px;">
      <h3>Línea de tiempo</h3>
      <div class="field-list" style="border:1px solid var(--border); border-radius:8px; overflow:hidden;">
        <div class="checklist-item" style="justify-content:space-between;"><span>📥 Ingresó al almacén central</span><span class="mono-cell">${ingreso ? fmtFecha(ingreso.fecha) : '—'}</span></div>
        <div class="checklist-item" style="justify-content:space-between;"><span>📦 Asignado a sede${asignacion ? ' — ' + getSede(asignacion.sede_id)?.nombre : ''}</span><span class="mono-cell">${asignacion ? fmtFecha(asignacion.fecha) : 'Aún no asignado'}</span></div>
        <div class="checklist-item" style="justify-content:space-between;"><span>🔧 Instalado${clienteInstalado ? ' — Cliente #'+clienteInstalado.codigo+' '+clienteInstalado.nombres+' '+clienteInstalado.apellidos : ''}</span><span class="mono-cell">${ordenInstalacion ? `${ordenInstalacion.numero_correlativo} (${fmtFecha(ordenInstalacion.fecha_descarga||ordenInstalacion.fecha_creacion)})` : 'No instalado'}</span></div>
      </div>
    </div>
    ${ordenInstalacion ? `<div class="card" style="max-width:760px;"><h3>Orden relacionada</h3><button class="btn ghost" id="btnVerOrdenEquipo">Ver orden ${ordenInstalacion.numero_correlativo}</button></div>` : ''}`;
  const btnVer = document.getElementById('btnVerOrdenEquipo');
  if (btnVer) btnVer.onclick = () => goTo('ordenes.imprimir', { id: ordenInstalacion.id });
}

function renderLogisticaMovimientos(page){
  const movs = [];
  db.ingresos_almacen.forEach(i => {
    const tipo = getTipoMaterial(getMaterial(i.material_id)?.tipo_material_id);
    let detalle;
    if (tipo?.es_serializado) {
      const series = db.items_serializados.filter(it => it.material_id === i.material_id && it.ingreso_id === i.id).map(it => it.serie_mac);
      detalle = series.length ? `Series: ${series.join(', ')}` : `Cant: ${i.cantidad}`;
    } else {
      detalle = `Cantidad: ${i.cantidad}`;
    }
    movs.push({ fecha:i.fecha, tipo:'Ingreso', material: getMaterial(i.material_id)?.nombre, detalle, sede:'Almacén central' });
  });
  db.asignaciones.forEach(a => {
    const tipo = getTipoMaterial(getMaterial(a.material_id)?.tipo_material_id);
    let detalle;
    if (tipo?.es_serializado) {
      const series = db.items_serializados.filter(it => it.material_id === a.material_id && it.asignacion_id === a.id).map(it => it.serie_mac);
      detalle = series.length ? `Series: ${series.join(', ')}` : `Cant: ${a.cantidad}`;
    } else {
      detalle = `Cantidad: ${a.cantidad}`;
    }
    movs.push({ fecha:a.fecha, tipo:'Asignación', material: getMaterial(a.material_id)?.nombre, detalle, sede: getSede(a.sede_id)?.nombre });
  });
  db.ordenes.forEach(o => o.consumos.forEach(c => movs.push({ fecha:c.fecha, tipo:'Consumo en orden', material: getMaterial(c.material_id)?.nombre, detalle: `${o.numero_correlativo}${c.item_serializado_id ? ' · serie ' + (db.items_serializados.find(i=>i.id===c.item_serializado_id)?.serie_mac||'') : ' · cant. ' + c.cantidad}`, sede: getSede(getCliente(o.cliente_codigo)?.sede_id)?.nombre })));
  movs.sort((a,b) => b.fecha.localeCompare(a.fecha));
  const pagina = pageSlice('movimientos', movs);
  page.innerHTML = `
    ${pageHead('Movimientos de almacén', 'Historial de ingresos, asignaciones y consumos.')}
    <div class="card"><div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Material</th><th>Sede</th><th>Detalle</th></tr></thead>
        <tbody>${pagina.map(m => `<tr><td class="mono-cell">${fmtFecha(m.fecha)}</td><td><span class="badge ${m.tipo==='Ingreso'?'blue':m.tipo==='Asignación'?'purple':'gray'}">${m.tipo}</span></td><td>${m.material||'—'}</td><td>${m.sede||'—'}</td><td class="mono-cell">${m.detalle}</td></tr>`).join('')}</tbody></table>
        ${pagina.length===0 ? '<div class="empty">Sin movimientos todavía.</div>' : ''}</div>
      ${pagerHTML('movimientos', movs.length)}
    </div>`;
  pagerBind('movimientos', renderPage);
}

function exportarNominaExcel(clientes){
  const filas = [
    ['Código','Nombres','Apellidos','DNI','Teléfono','Dirección','Sede','Sector','Plan','Precio S/','Usuario PPPoE','Contraseña PPPoE','Equipo','Serie/MAC','Caja NAP','Puerto NAP','Tipo IP','IP Fija','Estado','Fecha registro']
  ];
  clientes.forEach(c => {
    const ordenInst = db.ordenes.find(o => o.tipo==='instalacion' && o.cliente_codigo===c.codigo && o.estado==='cerrada');
    const equipoConsumo = ordenInst ? ordenInst.consumos.find(co=>co.item_serializado_id) : null;
    const item = equipoConsumo ? db.items_serializados.find(i=>i.id===equipoConsumo.item_serializado_id) : null;
    const mat = equipoConsumo ? getMaterial(equipoConsumo.material_id) : null;
    const cajaNap = getCajaNap(c.caja_nap_id);
    const plan = getPlan(c.plan_id);
    filas.push([
      '#'+c.codigo, c.nombres, c.apellidos, c.dni, c.telefono||'',
      c.direccion||'', getSede(c.sede_id)?.nombre||'', getSector(c.sector_id)?.nombre||'',
      plan?.nombre||'', plan?.precio||0,
      c.pppoe_user, c.pppoe_password,
      mat?.nombre||'', item?.serie_mac||'',
      cajaNap?.nombre||'', c.puerto_nap||'',
      c.tipo_ip||'dinamica', c.ip_asignada||'',
      c.estado, c.fecha_registro||''
    ]);
  });

  // Crear CSV con separador de tabulación (compatible con Excel)
  const csv = filas.map(fila => fila.map(v => {
    const str = String(v===null||v===undefined?'':v);
    return str.includes(',') || str.includes('"') || str.includes('\n') ? `"${str.replace(/"/g,'""')}"` : str;
  }).join('\t')).join('\n');

  const bom = '\uFEFF'; // BOM para que Excel lo abra con UTF-8 correctamente
  const blob = new Blob([bom + csv], { type: 'text/tab-separated-values;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `nomina-redify-${db.fechaActual}.tsv`;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
  toast(`Nómina exportada: ${clientes.length} cliente(s). Ábrela con Excel.`);
}

function renderReporteProyeccion(page){
  // Sincronizar recibos de todos los clientes activos antes de mostrar
  db.clientes.forEach(c => sincronizarRecibosCliente(c));
  save('recibos','clientes');

  const hoy = db.fechaActual;
  // Clientes con al menos un recibo pendiente o vencido
  const filas = [];
  db.clientes.filter(c => c.estado === 'activo' || c.estado === 'suspendido').forEach(c => {
    const pendientes = db.recibos.filter(r => r.cliente_codigo === c.codigo && r.estado !== 'pagado').sort((a,b)=>a.periodo.localeCompare(b.periodo));
    if (pendientes.length === 0) return;
    const deuda = pendientes.reduce((s,r) => s + pendienteDeRecibo(r), 0);
    const masAntiguo = pendientes[0];
    const diasParaCorte = Math.ceil((new Date(masAntiguo.fecha_vencimiento) - new Date(hoy)) / 86400000);
    filas.push({ c, pendientes, deuda, masAntiguo, diasParaCorte });
  });
  // Ordenar: primero los más urgentes (menos días para corte o ya vencidos)
  filas.sort((a,b) => a.diasParaCorte - b.diasParaCorte);

  const vencidos = filas.filter(f => f.masAntiguo.estado === 'vencido' || f.diasParaCorte < 0).length;
  const proximos = filas.filter(f => f.diasParaCorte >= 0 && f.diasParaCorte <= 7).length;

  page.innerHTML = `

    </div>
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Cliente</th><th>Sede</th><th>Plan S/</th>
            <th>Meses pendientes</th><th>Deuda total S/</th>
            <th>Vence / Venció</th><th>Urgencia</th><th></th>
          </tr></thead>
          <tbody>
            ${filas.map(f => {
              let urgenciaBadge, diasTexto;
              if (f.masAntiguo.estado === 'vencido' || f.diasParaCorte < 0) {
                urgenciaBadge = '<span class="badge red">corte ejecutado</span>';
                diasTexto = `Venció ${fmtFecha(f.masAntiguo.fecha_vencimiento)}`;
              } else if (f.diasParaCorte === 0) {
                urgenciaBadge = '<span class="badge red">vence hoy</span>';
                diasTexto = 'Vence HOY';
              } else if (f.diasParaCorte <= 3) {
                urgenciaBadge = '<span class="badge red">crítico</span>';
                diasTexto = `${f.diasParaCorte} día(s)`;
              } else if (f.diasParaCorte <= 7) {
                urgenciaBadge = '<span class="badge amber">próximo</span>';
                diasTexto = `${f.diasParaCorte} día(s)`;
              } else {
                urgenciaBadge = '<span class="badge gray">pendiente</span>';
                diasTexto = `${f.diasParaCorte} día(s)`;

              return `<tr>

function renderReporteTecnicos(page){
  const tecnicos = db.usuarios.filter(u=>u.rol==='tecnico');
  const filas = tecnicos.map(t => {
    const propias = db.ordenes.filter(o => o.tecnico_id === t.id);
    const cerradas = propias.filter(o => o.estado === 'cerrada');
    const instalaciones = propias.filter(o => o.tipo === 'instalacion' && o.estado === 'cerrada').length;

        u.email = v.email; u.nombre = v.nombre; u.rol = v.rol;
        u.sede_id = (v.rol === 'tecnico' && v.sede_id) ? Number(v.sede_id) : null;
        if (supabaseClient) await supabaseClient.from('usuarios').upsert({ id: u.id, email: u.email, nombre: u.nombre, rol: u.rol, sede_id: u.sede_id, activo: true });
        save('usuarios'); closeModal(); renderPage(); toast('Usuario actualizado.');
      } else {
        if (!v.password || v.password.length < 6) { toast('La contraseña debe tener al menos 6 caracteres.'); return; }
        if (!supabaseClient) { toast('Sin conexión a Supabase.'); return; }
        if (btn) { btn.disabled = true; btn.textContent = 'Creando...'; }
        try {
          // Crear en Supabase Auth con signUp
          const { data, error } = await supabaseClient.auth.signUp({ email: v.email, password: v.password });
          if (error) { toast(`Error: ${error.message}`); if (btn) { btn.disabled = false; btn.textContent = 'Crear usuario'; } return; }
          const uid = data.user?.id;
          if (!uid) { toast('No se obtuvo el ID del usuario.'); if (btn) { btn.disabled = false; btn.textContent = 'Crear usuario'; } return; }
          // Insertar en tabla usuarios de Supabase
          const nuevoUsuario = { id: uid, email: v.email, nombre: v.nombre, rol: v.rol, sede_id: (v.rol==='tecnico' && v.sede_id) ? Number(v.sede_id) : null, activo: true };
          const { error: errU } = await supabaseClient.from('usuarios').insert(nuevoUsuario);
          if (errU) { toast(`Cuenta creada en Auth pero error en tabla: ${errU.message}`); }
          // Agregar localmente
          db.usuarios.push({ ...nuevoUsuario, password:'' });
          save('usuarios'); closeModal(); renderPage();
          toast(`Usuario "${v.nombre}" creado. Se envió un correo de confirmación a ${v.email}.`);
        } catch(err) {
          toast(`Error inesperado: ${err.message}`);
          if (btn) { btn.disabled = false; btn.textContent = 'Crear usuario'; }
        }
      }
    }
  });
}
function rolBadge(rol){ const map={admin:'purple', atencion_cliente:'blue', tecnico:'green', vendedor:'amber'}; return `<span class="badge ${map[rol]}">${rolLabel(rol)}</span>`; }

(async () => {
  const sc = supabaseClient;
  if (sc) {
    try {
      const { data: { session } } = await sc.auth.getSession();
      if (session) {
        const { data: usuario } = await sc.from('usuarios').select('*').eq('id', session.user.id).single();
        if (usuario && usuario.activo !== false) {
          sesion = { usuarioId: usuario.id, rol: usuario.rol };
          await loadCloudDb();
          iniciarRealtime();
        }
      }
    } catch(e) {
      console.warn('No se pudo restaurar sesión:', e);
    }
  }
  render();
})();
</script>
